# Configuration de Plume — copier en config/plume.yaml puis adapter.
# Ce fichier est validé au démarrage : tout champ inconnu ou invalide empêche le démarrage.
# Aucun secret ne doit y figurer en clair : on référence des fichiers (*_file) ou des variables
# d'environnement (*_env).

server:
  # Adresse publique, identique à PLUME_SITE_ADDRESS (fichier .env, défaut : localhost).
  public_url: https://localhost
  trusted_proxies: ['172.16.0.0/12']

# Liste blanche : seuls ces domaines peuvent se connecter.
# Le domaine est déduit de l'adresse saisie (partie après @).
# Chaque domaine indique SON serveur IMAP/SMTP : l'hôte n'est JAMAIS choisi par l'utilisateur.
domains:
  - domain: exemple.com
    imap: { host: imap.exemple.com, port: 993, security: tls }
    smtp: { host: smtp.exemple.com, port: 465, security: tls }
  - domain: '*.exemple.fr' # sous-domaines autorisés, pas exemple.fr lui-même
    imap: { host: mail.exemple.fr, port: 993, security: tls }
    smtp: { host: mail.exemple.fr, port: 587, security: starttls }
    tls: { reject_unauthorized: true } # défaut true, ne pas désactiver en prod
  # Limiter l'accès à certains comptes du domaine : ajouter « accounts » (parties locales ou
  # adresses complètes). Sans cette option, tout compte du domaine peut se connecter.
  # - domain: exemple.org
  #   accounts: [sacha, alice@exemple.org]
  #   imap: { host: imap.exemple.org, port: 993, security: tls }
  #   smtp: { host: smtp.exemple.org, port: 465, security: tls }
  # Envoi par un relais SMTP commun (prestataire d'envoi, relais du FAI…) dont les identifiants
  # diffèrent de ceux des boîtes : ajouter « auth » au bloc smtp. L'expéditeur reste l'adresse
  # de l'utilisateur connecté (le relais doit l'autoriser : SPF/DKIM du domaine).
  # - domain: exemple.org
  #   imap: { host: imap.exemple.org, port: 993, security: tls }
  #   smtp:
  #     host: smtp-relay.fournisseur.example
  #     port: 587
  #     security: starttls
  #     auth:
  #       username: relais@exemple.org
  #       password_env: PLUME_SMTP_RELAY_PASSWORD # fichier .env ; ou password_file: /chemin

auth:
  session_ttl: 12h
  idle_timeout: 30m
  remember_me_ttl: 30d
  totp: optional # disabled | optional | required
  rate_limit:
    per_ip: { max: 10, window: 15m }
    per_account: { max: 5, window: 15m, lockout: 30m }

security:
  master_key_file: /run/secrets/plume_master_key
  remote_images: block_by_default # block_by_default | allow
  max_attachment_size: 25MB
  max_upload_total: 50MB

rules:
  enabled: true
  max_rules_per_user: 100
  forward:
    enabled: true
    allowed_destination_domains: ['exemple.com'] # vide = transfert interdit

database:
  url_file: /run/secrets/database_url
redis:
  url_file: /run/secrets/redis_url

logging:
  level: info
  format: json

name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # chaque lundi : nouvelles vulnérabilités publiées entre-temps
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST (Semgrep + ESLint security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (bloquant sur sévérité élevée)
        run: >
          semgrep scan
          --config p/typescript --config p/owasp-top-ten --config p/nodejs
          --severity ERROR --error --metrics off
          --exclude node_modules --exclude dist

  eslint-security:
    name: ESLint (eslint-plugin-security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  dependencies:
    name: Dépendances (pnpm audit + OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (élevée ou critique)
        run: pnpm audit --audit-level high
      - name: OSV-Scanner
        run: >
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.6.0
          scan source --lockfile /src/pnpm-lock.yaml --config /src/osv-scanner.toml

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (historique complet)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --config /repo/.gitleaks.toml

  dockerfiles:
    name: Dockerfiles (Hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        dockerfile: [apps/api/Dockerfile, apps/worker/Dockerfile, deploy/caddy/Dockerfile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          failure-threshold: error

  images:
    name: Images et configuration (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparation (configuration d'exemple)
        run: |
          cp config/plume.example.yaml config/plume.yaml
      - name: Construction des images
        run: docker compose build
      - name: Trivy — configuration (Dockerfiles, Compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Trivy — image api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: plume/api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Trivy — image worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: plume/worker:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Trivy — image caddy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: plume/caddy:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE: compose.yaml:deploy/docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Démarrage de la pile (configuration de test, GreenMail)
        run: |
          touch config/plume.yaml
          docker compose up -d --build --wait --wait-timeout 300
      - name: Vérification des conteneurs non-root
        run: ./scripts/check-nonroot.sh
      - name: ZAP — scan de base
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" -v "$PWD/.zap:/zap/cfg:ro" \
            ghcr.io/zaproxy/zaproxy:2.17.0 zap-baseline.py \
            -t https://localhost -c /zap/cfg/rules.tsv -J baseline.json -r baseline.html -I
      - name: ZAP — scan authentifié de l'API (OpenAPI)
        run: ./scripts/zap-api-scan.sh https://localhost carol@exemple.com e2e-password-carol
      - name: ZAP — seuil bloquant (alertes de niveau élevé)
        run: node scripts/zap-check.mjs zap/baseline.json zap/api.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-reports
          path: zap/
          retention-days: 14
      - name: Journaux de la pile
        if: failure()
        run: docker compose logs --no-color --tail=200
